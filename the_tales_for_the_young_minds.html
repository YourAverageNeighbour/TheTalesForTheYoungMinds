      // Initialize background particle canvas
      useEffect(() => {
        const canvas = document.getElementById('bg-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const stars = Array.from({ length: 90 }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.5 + 0.5,
          alpha: Math.random(),
          speed: Math.random() * 0.01 + 0.003
        }));

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const render = () => {
          ctx.clearRect(0, 0, width, height);
          stars.forEach(star => {
            star.alpha += star.speed;
            if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(251, 191, 36, ${Math.abs(star.alpha) * 0.6})`;
            ctx.fill();
          });
          animationFrameId = requestAnimationFrame(render);
        };
        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

    // --- STREAMING_CHUNK: Defining Interactive Reader View Component... ---
    function InteractiveReaderView({ story, onBack, onSaveScore, savedScore }) {
      const [currentPage, setCurrentPage] = useState(0);
      const [isNarrating, setIsNarrating] = useState(false);
      const [selectedWord, setSelectedWord] = useState(null);
      const [quizAnswers, setQuizAnswers] = useState({});
      const [quizSubmitted, setQuizSubmitted] = useState(false);
      const [score, setScore] = useState(0);

      // Speech Synthesis Narrator setup
      useEffect(() => {
        return () => {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
          }
        };
      }, []);

      const toggleNarration = () => {
        if (!('speechSynthesis' in window)) {
          alert('Speech synthesis is not supported on this browser.');
          return;
        }

        if (isNarrating) {
          window.speechSynthesis.cancel();
          setIsNarrating(false);
        } else {
          window.speechSynthesis.cancel();
          const pageText = story.pages[currentPage].text;
          const utterance = new SpeechSynthesisUtterance(pageText);
          utterance.rate = 0.9;
          utterance.pitch = 1.0;
          utterance.onend = () => setIsNarrating(false);
          window.speechSynthesis.speak(utterance);
          setIsNarrating(true);
        }
      };

      const handlePageChange = (newPage) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          setIsNarrating(false);
        }
        setCurrentPage(newPage);
      };

      const handleQuizSubmit = () => {
        let sc = 0;
        story.quiz.forEach((q, idx) => {
          if (quizAnswers[idx] === q.answer) sc++;
        });
        setScore(sc);
        setQuizSubmitted(true);
        onSaveScore(story.id, sc);
        if (sc === story.quiz.length && typeof confetti === 'function') {
          confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
      };

      const page = story.pages[currentPage];

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          {/* HEADER BACK CONTROLS */}
          <div className="flex items-center justify-between glass-panel p-4 rounded-2xl">
            <button 
              onClick={onBack}
              className="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 text-xs font-bold text-slate-300 hover:text-amber-400 transition flex items-center gap-2"
            >
              <i className="fa-solid fa-arrow-left"></i> Back to Portal
            </button>
            <div className="text-center">
              <h2 className="text-base font-bold font-cinzel text-amber-300">{story.title}</h2>
              <span className="text-[10px] text-slate-400">Page {currentPage + 1} of {story.pages.length}</span>
            </div>
            <button
              onClick={toggleNarration}
              className={`px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-2 transition ${
                isNarrating 
                  ? 'bg-red-500 text-white animate-pulse' 
                  : 'bg-amber-500 text-slate-950 hover:bg-amber-400'
              }`}
            >
              <i className={`fa-solid ${isNarrating ? 'fa-pause' : 'fa-volume-high'}`}></i>
              <span className="hidden sm:inline">{isNarrating ? 'Pause Reader' : 'Listen Voice'}</span>
            </button>
          </div>

          {/* READER DISPLAY BOOK SHEET */}
          <div className="glass-panel p-6 sm:p-8 rounded-3xl border border-amber-500/20 shadow-2xl relative overflow-hidden min-h-[420px] flex flex-col justify-between">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
              {/* Dynamic Page Visual */}
              <div className="h-64 sm:h-80 w-full rounded-2xl overflow-hidden border border-slate-700 shadow-lg">
                <FallbackImage 
                  src={page.image} 
                  alt={story.title}
                  category={story.category}
                  title={story.title}
                  className="w-full h-full object-cover"
                />
              </div>

              {/* Story Page Paragraph Text */}
              <div className="flex flex-col justify-center space-y-4">
                <p className="text-base sm:text-lg text-slate-100 leading-relaxed font-serif">
                  {page.text}
                </p>

                {/* Glossary Hotspots */}
                {story.glossary && story.glossary.length > 0 && (
                  <div className="pt-2">
                    <span className="text-[10px] uppercase font-bold text-amber-400 block mb-1">Interactive Word Definitions:</span>
                    <div className="flex flex-wrap gap-2">
                      {story.glossary.map((g, idx) => (
                        <button
                          key={idx}
                          onClick={() => setSelectedWord(g)}
                          className="text-xs bg-indigo-950/80 border border-indigo-500/40 text-indigo-300 px-2.5 py-1 rounded-lg hover:border-amber-400 transition"
                        >
                          <i className="fa-solid fa-book text-[10px] mr-1"></i> {g.word}
                        </button>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>

            {/* PAGE NAVIGATION CONTROLS */}
            <div className="flex items-center justify-between border-t border-slate-800 pt-6 mt-6">
              <button
                disabled={currentPage === 0}
                onClick={() => handlePageChange(currentPage - 1)}
                className="px-4 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs font-bold text-slate-300 disabled:opacity-40 hover:text-amber-400 transition flex items-center gap-2"
              >
                <i className="fa-solid fa-chevron-left"></i> Previous Page
              </button>

              <div className="flex items-center gap-1.5">
                {story.pages.map((_, i) => (
                  <div
                    key={i}
                    onClick={() => handlePageChange(i)}
                    className={`w-2.5 h-2.5 rounded-full cursor-pointer transition ${
                      currentPage === i ? 'bg-amber-400 scale-125' : 'bg-slate-700'
                    }`}
                  ></div>
                ))}
              </div>

              <button
                disabled={currentPage === story.pages.length - 1}
                onClick={() => handlePageChange(currentPage + 1)}
                className="px-4 py-2 rounded-xl bg-amber-500 text-slate-950 text-xs font-bold disabled:opacity-40 hover:bg-amber-400 transition flex items-center gap-2"
              >
                Next Page <i className="fa-solid fa-chevron-right"></i>
              </button>
            </div>
          </div>

          {/* MORAL & REFLECTION SECTION */}
          {currentPage === story.pages.length - 1 && (
            <div className="space-y-6 animate-fadeIn">
              <div className="glass-panel p-6 rounded-2xl border border-amber-500/40 bg-gradient-to-r from-amber-500/10 via-slate-900 to-indigo-950 text-center">
                <i className="fa-solid fa-quote-left text-2xl text-amber-400 mb-2 block"></i>
                <h3 className="text-sm uppercase font-bold text-amber-300 tracking-wider mb-1">Key Moral Takeaway</h3>
                <p className="text-base font-serif text-slate-100 italic">"{story.moral}"</p>
              </div>

              {/* COMPREHENSION QUIZ */}
              <div className="glass-panel p-6 rounded-2xl border border-slate-800 space-y-4">
                <div className="flex items-center gap-3 border-b border-slate-800 pb-3">
                  <i className="fa-solid fa-brain text-amber-400 text-xl"></i>
                  <div>
                    <h3 className="text-base font-bold font-cinzel text-amber-300">Wisdom Quiz Challenge</h3>
                    <p className="text-xs text-slate-400">Test how well you remembered key details from this adventure!</p>
                  </div>
                </div>

                {story.quiz.map((q, idx) => (
                  <div key={idx} className="space-y-2 bg-slate-900/60 p-4 rounded-xl border border-slate-800">
                    <p className="text-sm font-semibold text-slate-200">{idx + 1}. {q.q}</p>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {q.options.map((opt, optIdx) => (
                        <button
                          key={optIdx}
                          onClick={() => setQuizAnswers({ ...quizAnswers, [idx]: optIdx })}
                          className={`p-2.5 rounded-lg text-xs font-medium text-left border transition ${
                            quizAnswers[idx] === optIdx
                              ? 'bg-amber-500/20 border-amber-400 text-amber-300'
                              : 'bg-slate-800/60 border-slate-700 text-slate-300 hover:bg-slate-800'
                          }`}
                        >
                          {opt}
                        </button>
                      ))}
                    </div>
                  </div>
                ))}

                <div className="flex items-center justify-between pt-2">
                  {!quizSubmitted ? (
                    <button
                      onClick={handleQuizSubmit}
                      disabled={Object.keys(quizAnswers).length < story.quiz.length}
                      className="px-6 py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs disabled:opacity-50 hover:bg-amber-400 transition shadow-lg shadow-amber-500/20"
                    >
                      Submit Quiz Answers
                    </button>
                  ) : (
                    <div className="flex items-center gap-3">
                      <span className="text-sm font-bold text-amber-300">
                        Score: {score} / {story.quiz.length}
                      </span>
                      <span className="text-xs text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded-md border border-emerald-500/30">
                        <i className="fa-solid fa-award mr-1"></i> Saved to Badges
                      </span>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* GLOSSARY DEFINITION MODAL POPUP */}
          {selectedWord && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="glass-panel max-w-sm w-full p-6 rounded-2xl border border-amber-500/40 text-center relative">
                <button 
                  onClick={() => setSelectedWord(null)}
                  className="absolute top-3 right-3 text-slate-400 hover:text-white"
                >
                  <i className="fa-solid fa-xmark"></i>
                </button>
                <i className="fa-solid fa-book-open text-3xl text-amber-400 mb-2"></i>
                <h4 className="text-lg font-bold text-amber-300 font-cinzel mb-1">{selectedWord.word}</h4>
                <p className="text-xs text-slate-300 leading-relaxed mb-4">{selectedWord.def}</p>
                <button
                  onClick={() => setSelectedWord(null)}
                  className="w-full py-2 bg-amber-500 text-slate-950 font-bold text-xs rounded-xl hover:bg-amber-400"
                >
                  Got It!
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- STREAMING_CHUNK: Defining Surprise Roulette View Component... ---
    function SurpriseRouletteView({ stories, onSelectStory }) {
      const [spinning, setSpinning] = useState(false);
      const [selected, setSelected] = useState(null);

      const spinWheel = () => {
        if (spinning) return;
        setSpinning(true);
        setSelected(null);

        let count = 0;
        const maxSpins = 20;
        const interval = setInterval(() => {
          const randomIndex = Math.floor(Math.random() * stories.length);
          setSelected(stories[randomIndex]);
          count++;
          if (count >= maxSpins) {
            clearInterval(interval);
            setSpinning(false);
          }
        }, 100);
      };

      return (
        <div className="max-w-2xl mx-auto text-center space-y-6 py-8">
          <div>
            <h2 className="text-3xl font-bold font-cinzel text-amber-300 glow-text-gold mb-2">
              Surprise Tale Roulette
            </h2>
            <p className="text-xs sm:text-sm text-slate-300">
              Can't decide which story to explore next? Spin the magical fate wheel!
            </p>
          </div>

          <div className="glass-panel p-8 rounded-3xl border border-amber-500/30 flex flex-col items-center justify-center relative overflow-hidden min-h-[320px]">
            {/* Animated Glow Circle */}
            <div className={`w-48 h-48 rounded-full border-4 border-dashed border-amber-400 flex items-center justify-center p-4 transition-transform duration-500 ${spinning ? 'animate-spin' : ''}`}>
              <div className="w-full h-full rounded-full bg-gradient-to-tr from-amber-500 to-indigo-600 flex items-center justify-center p-2 shadow-2xl">
                <div className="w-full h-full bg-slate-900 rounded-full flex flex-col items-center justify-center p-2 text-center">
                  <i className="fa-solid fa-dice-d20 text-4xl text-amber-400 mb-2"></i>
                  <span className="text-[10px] text-slate-400 uppercase font-bold tracking-widest">
                    {spinning ? 'Selecting Fate...' : 'Fate Wheel'}
                  </span>
                </div>
              </div>
            </div>

            {selected && !spinning && (
              <div className="mt-6 animate-fadeIn space-y-3">
                <span className="text-xs text-amber-400 font-bold uppercase tracking-widest block">Your Selected Adventure:</span>
                <h3 className="text-xl font-bold font-cinzel text-slate-100">{selected.title}</h3>
                <p className="text-xs text-slate-400 max-w-md mx-auto">{selected.summary}</p>
                <button
                  onClick={() => onSelectStory(selected)}
                  className="px-6 py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs hover:bg-amber-400 transition shadow-lg shadow-amber-500/20"
                >
                  Begin This Adventure <i className="fa-solid fa-arrow-right ml-1"></i>
                </button>
              </div>
            )}
          </div>

          <button
            onClick={spinWheel}
            disabled={spinning}
            className="px-8 py-3 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold text-sm shadow-xl shadow-amber-500/20 hover:scale-105 transition disabled:opacity-50"
          >
            <i className="fa-solid fa-wand-magic-sparkles mr-2"></i>
            {spinning ? 'Spinning Magic Wheel...' : 'Spin Surprise Wheel'}
          </button>
        </div>
      );
    }

    // --- STREAMING_CHUNK: Defining Character Universe View Component... ---
    function CharacterUniverseView({ characters }) {
      return (
        <div className="space-y-6">
          <div className="text-center max-w-2xl mx-auto">
            <h2 className="text-3xl font-bold font-cinzel text-amber-300 glow-text-gold mb-2">
              Character Universe Explorer
            </h2>
            <p className="text-xs sm:text-sm text-slate-300">
              Meet the courageous heroes, clever tricksters, and mythic guardians across our storytelling realms.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {characters.map((char, idx) => (
              <div key={idx} className="glass-card p-6 rounded-2xl space-y-4 border border-slate-800">
                <div className="flex items-center gap-4">
                  <div className={`w-14 h-14 rounded-2xl ${char.color} flex items-center justify-center text-slate-950 text-2xl font-bold shadow-lg`}>
                    <i className={`fa-solid ${char.icon}`}></i>
                  </div>
                  <div>
                    <h3 className="text-base font-bold font-cinzel text-slate-100">{char.name}</h3>
                    <span className="text-xs text-amber-400 font-semibold">{char.origin}</span>
                  </div>
                </div>

                <div className="bg-slate-900/60 p-3 rounded-xl border border-slate-800 text-xs">
                  <span className="text-slate-400 font-bold block mb-0.5">Special Skill / Power:</span>
                  <span className="text-amber-300 font-semibold">{char.power}</span>
                </div>

                <p className="text-xs text-slate-300 leading-relaxed">{char.bio}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- STREAMING_CHUNK: Defining External Links View Component... ---
    function MoreExploreView({ links }) {
      return (
        <div className="space-y-6">
          <div className="text-center max-w-2xl mx-auto">
            <h2 className="text-3xl font-bold font-cinzel text-amber-300 glow-text-gold mb-2">
              Curated Learning Links
            </h2>
            <p className="text-xs sm:text-sm text-slate-300">
              Discover 22+ verified external educational & story portals to continue your learning journey safely.
            </p>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            {links.map((link, idx) => (
              <a
                key={idx}
                href={link.url}
                target="_blank"
                rel="noopener noreferrer"
                className="glass-card p-4 rounded-xl flex items-center gap-3 group border border-slate-800 hover:border-amber-500/40"
              >
                <div className="w-10 h-10 rounded-lg bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 group-hover:bg-amber-500 group-hover:text-slate-950 transition">
                  <i className={`fa-solid ${link.icon} text-base`}></i>
                </div>
                <div className="flex-1 min-w-0">
                  <span className="text-[10px] text-amber-400 uppercase font-bold tracking-wider block">{link.cat}</span>
                  <h4 className="text-xs font-bold text-slate-200 group-hover:text-amber-300 transition truncate">{link.name}</h4>
                </div>
                <i className="fa-solid fa-arrow-up-right-from-square text-xs text-slate-500 group-hover:text-amber-400 transition"></i>
              </a>
            ))}
          </div>
        </div>
      );
    }

    // --- STREAMING_CHUNK: Rendering React Application to DOM... ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
